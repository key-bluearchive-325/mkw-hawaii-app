name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: アプリ名
        default: データ通信量
      package_name:
        description: パッケージ名（英小文字・数字・ドット）
        default: com.example.datausage
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ inputs.app_name || 'データ通信量' }}
      PKG: ${{ inputs.package_name || 'com.example.datausage' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generate project
        run: |
          D=app/src/main
          mkdir -p $D/java/com/example/datausage $D/res/values $D/res/drawable $D/res/mipmap-anydpi-v26
          cp K1.kt K2.kt K3.kt $D/java/com/example/datausage/
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DataUsage"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.datausage"
              compileSdk = 34
              defaultConfig {
                  applicationId = "PKG_HERE"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.2"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF
          sed -i "s/PKG_HERE/$PKG/" app/build.gradle.kts
          cat > $D/res/values/strings.xml <<EOF
          <resources>
              <string name="app_name">$APP_NAME</string>
              <string name="name2">通信モニター</string>
              <string name="name3">Data Ring</string>
              <string name="name4">Bolt</string>
          </resources>
          EOF
          i=0
          { echo "<resources>"
            for c in 5B6CFF 0EA5A4 7C3AED F59E0B; do i=$((i+1)); echo "<color name=\"bg$i\">#$c</color>"; done
            echo "</resources>"; } > $D/res/values/colors.xml
          mkfg() { echo "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"108dp\" android:height=\"108dp\" android:viewportWidth=\"108\" android:viewportHeight=\"108\"><path android:fillColor=\"#FFFFFF\" $3 android:pathData=\"$2\"/></vector>" > $D/res/drawable/fg$1.xml; }
          mkfg 1 "M32,72L42,72L42,58L32,58Z M49,72L59,72L59,46L49,46Z M66,72L76,72L76,34L66,34Z"
          mkfg 2 "M38,32L46,32L46,58L54,58L42,72L30,58L38,58Z M62,76L70,76L70,50L78,50L66,36L54,50L62,50Z"
          mkfg 3 "M54,54m-22,0a22,22 0 1,0 44,0a22,22 0 1,0 -44,0M54,54m-14,0a14,14 0 1,0 28,0a14,14 0 1,0 -28,0" 'android:fillType="evenOdd"'
          mkfg 4 "M58,30L40,58L52,58L48,78L68,48L55,48Z"
          for n in 1 2 3 4; do
            printf '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/bg%s"/><foreground android:drawable="@drawable/fg%s"/></adaptive-icon>\n' $n $n > $D/res/mipmap-anydpi-v26/ic_$n.xml
          done
          {
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">'
            echo '<uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions"/>'
            echo '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission"/>'
            echo '<application android:icon="@mipmap/ic_1" android:label="@string/app_name" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">'
            echo '<activity android:name=".MainActivity" android:exported="true" android:icon="@mipmap/ic_1" android:label="@string/app_name"/>'
            for n in 1 2 3 4; do
              en=false; lab="@string/name$n"
              if [ $n = 1 ]; then en=true; lab="@string/app_name"; fi
              echo "<activity-alias android:name=\".Alias$n\" android:targetActivity=\".MainActivity\" android:exported=\"true\" android:enabled=\"$en\" android:icon=\"@mipmap/ic_$n\" android:label=\"$lab\"><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity-alias>"
            done
            echo '</application></manifest>'
          } > $D/AndroidManifest.xml
      - run: gradle assembleDebug --no-daemon
      - name: APKの場所を確認
        run: find app/build/outputs -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DataUsage-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Releaseに公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --title "Build ${{ github.run_number }}" --notes "APK"
# END