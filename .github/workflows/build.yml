name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: アプリ名
        default: データ通信量
      package_name:
        description: パッケージ名（英小文字・数字・ドット）
        default: com.example.datausage
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/example/datausage
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DataUsage"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.datausage"
              compileSdk = 34
              defaultConfig {
                  applicationId = "${{ inputs.package_name || 'com.example.datausage' }}"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.2"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">${{ inputs.app_name || 'データ通信量' }}</string>
              <string name="name2">通信モニター</string>
              <string name="name3">Data Ring</string>
              <string name="name4">Bolt</string>
          </resources>
          EOF
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="bg1">#5B6CFF</color>
              <color name="bg2">#0EA5A4</color>
              <color name="bg3">#7C3AED</color>
              <color name="bg4">#F59E0B</color>
          </resources>
          EOF
          fg() { echo "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"108dp\" android:height=\"108dp\" android:viewportWidth=\"108\" android:viewportHeight=\"108\"><path android:fillColor=\"#FFFFFF\" $3 android:pathData=\"$2\"/></vector>" > app/src/main/res/drawable/fg$1.xml; }
          fg 1 "M32,72L42,72L42,58L32,58Z M49,72L59,72L59,46L49,46Z M66,72L76,72L76,34L66,34Z"
          fg 2 "M38,32L46,32L46,58L54,58L42,72L30,58L38,58Z M62,76L70,76L70,50L78,50L66,36L54,50L62,50Z"
          fg 3 "M54,54m-22,0a22,22 0 1,0 44,0a22,22 0 1,0 -44,0M54,54m-14,0a14,14 0 1,0 28,0a14,14 0 1,0 -28,0" 'android:fillType="evenOdd"'
          fg 4 "M58,30L40,58L52,58L48,78L68,48L55,48Z"
          for i in 1 2 3 4; do
            printf '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/bg%s"/><foreground android:drawable="@drawable/fg%s"/></adaptive-icon>\n' $i $i > app/src/main/res/mipmap-anydpi-v26/ic_$i.xml
          done
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <application
                  android:icon="@mipmap/ic_1"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:icon="@mipmap/ic_1" android:label="@string/app_name" />

                  <activity-alias android:name=".Alias1" android:targetActivity=".MainActivity"
                      android:exported="true" android:enabled="true"
                      android:icon="@mipmap/ic_1" android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>
                  <activity-alias android:name=".Alias2" android:targetActivity=".MainActivity"
                      android:exported="true" android:enabled="false"
                      android:icon="@mipmap/ic_2" android:label="@string/name2">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>
                  <activity-alias android:name=".Alias3" android:targetActivity=".MainActivity"
                      android:exported="true" android:enabled="false"
                      android:icon="@mipmap/ic_3" android:label="@string/name3">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>
                  <activity-alias android:name=".Alias4" android:targetActivity=".MainActivity"
                      android:exported="true" android:enabled="false"
                      android:icon="@mipmap/ic_4" android:label="@string/name4">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/datausage/MainActivity.kt <<'EOF'
          package com.example.datausage

          import android.app.Activity
          import android.app.AppOpsManager
          import android.app.usage.NetworkStats
          import android.app.usage.NetworkStatsManager
          import android.app.usage.UsageStatsManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.content.pm.ShortcutInfo
          import android.content.pm.ShortcutManager
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.net.ConnectivityManager
          import android.net.TrafficStats
          import android.os.BatteryManager
          import android.os.Bundle
          import android.os.Process
          import android.provider.Settings
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.graphics.toArgb
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.SpanStyle
          import androidx.compose.ui.text.buildAnnotatedString
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.text.withStyle
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.graphics.drawable.toBitmap
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          const val NS = "com.example.datausage"
          private val PRESET_LABELS = listOf("📶 データ通信量(標準)", "⇅ 通信モニター", "◯ Data Ring", "⚡ Bolt")
          private val WifiColor = Color(0xFF4FC3F7)
          private val MobileColor = Color(0xFFFFB74D)

          private val DarkScheme = darkColorScheme(
              primary = Color(0xFF8FA8FF),
              background = Color(0xFF0E1117),
              surface = Color(0xFF171B24),
              onBackground = Color(0xFFE8EAF0),
              onSurface = Color(0xFFE8EAF0),
              onSurfaceVariant = Color(0xFF9AA3B5),
              surfaceVariant = Color(0xFF262C38)
          )
          private val LightScheme = lightColorScheme(
              primary = Color(0xFF4A63E7),
              background = Color(0xFFF3F5FB),
              surface = Color.White,
              onBackground = Color(0xFF14171F),
              onSurface = Color(0xFF14171F),
              onSurfaceVariant = Color(0xFF6B7385),
              surfaceVariant = Color(0xFFE4E8F2)
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  applyRefreshRate(this, getSharedPreferences("s", 0).getBoolean("hz", true))
                  setContent {
                      MaterialTheme(colorScheme = if (isSystemInDarkTheme()) DarkScheme else LightScheme) {
                          Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) { Root() }
                      }
                  }
              }
          }

          // ---------- 120Hz ----------
          @Suppress("DEPRECATION")
          fun applyRefreshRate(act: Activity, enabled: Boolean) {
              val d = act.windowManager.defaultDisplay
              val cur = d.mode
              val best = d.supportedModes
                  .filter { it.physicalWidth == cur.physicalWidth && it.physicalHeight == cur.physicalHeight }
                  .maxByOrNull { it.refreshRate } ?: return
              val lp = act.window.attributes
              lp.preferredDisplayModeId = if (enabled) best.modeId else 0
              lp.preferredRefreshRate = if (enabled) best.refreshRate else 0f
              act.window.attributes = lp
          }

          // ---------- アイコン/名前 ----------
          fun setLauncherPreset(ctx: Context, sel: Int) {
              val pm = ctx.packageManager
              fun cn(i: Int) = ComponentName(ctx.packageName, "$NS.Alias${i + 1}")
              pm.setComponentEnabledSetting(cn(sel), PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP)
              PRESET_LABELS.indices.filter { it != sel }.forEach {
                  pm.setComponentEnabledSetting(cn(it), PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP)
              }
          }

          fun pinShortcut(ctx: Context, name: String, emoji: String, bg: Int): Boolean {
              val sm = ctx.getSystemService(ShortcutManager::class.java)
              if (!sm.isRequestPinShortcutSupported) return false
              val bmp = Bitmap.createBitmap(192, 192, Bitmap.Config.ARGB_8888)
              val c = Canvas(bmp)
              val p = Paint(Paint.ANTI_ALIAS_FLAG)
              p.color = bg
              c.drawRoundRect(0f, 0f, 192f, 192f, 48f, 48f, p)
              p.color = 0xFFFFFFFF.toInt()
              p.textSize = 104f
              p.textAlign = Paint.Align.CENTER
              val y = 96f - (p.descent() + p.ascent()) / 2
              c.drawText(emoji.ifBlank { "📶" }, 96f, y, p)
              val intent = Intent(ctx, MainActivity::class.java).setAction(Intent.ACTION_MAIN)
              val info = ShortcutInfo.Builder(ctx, "c${System.currentTimeMillis()}")
                  .setShortLabel(name.ifBlank { "通信量" })
                  .setIcon(android.graphics.drawable.Icon.createWithBitmap(bmp))
                  .setIntent(intent)
                  .build()
              return sm.requestPinShortcut(info, null)
          }

          // ---------- データ ----------
          data class AppUsage(
              val label: String, val pkg: String,
              val wifi: Long, val mobile: Long, val fgMs: Long,
              val icon: ImageBitmap?
          ) {
              val total get() = wifi + mobile
          }

          data class DayTotal(val label: String, val wifi: Long, val mobile: Long)
          data class Loaded(val apps: List<AppUsage> = emptyList(), val days: List<DayTotal> = emptyList())
          data class Batt(val pct: Int, val charging: Boolean, val tempC: Float)

          fun readBattery(ctx: Context): Batt {
              val i = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
              val lv = i?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
              val sc = i?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
              val st = i?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
              val t = i?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0
              return Batt(
                  if (lv < 0) 0 else lv * 100 / sc,
                  st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL,
                  t / 10f
              )
          }

          fun hasUsageAccess(ctx: Context): Boolean {
              val ops = ctx.getSystemService(AppOpsManager::class.java)
              return ops.unsafeCheckOpNoThrow(
                  AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), ctx.packageName
              ) == AppOpsManager.MODE_ALLOWED
          }

          fun fmt(b: Long): String = when {
              b >= 1L shl 30 -> "%.2f GB".format(b / (1L shl 30).toDouble())
              b >= 1L shl 20 -> "%.1f MB".format(b / (1L shl 20).toDouble())
              b >= 1L shl 10 -> "%.0f KB".format(b / 1024.0)
              else -> "$b B"
          }

          fun fmtTime(ms: Long): String {
              val m = ms / 60000
              return when {
                  m >= 60 -> "${m / 60}時間${m % 60}分"
                  m >= 1 -> "${m}分"
                  ms > 0 -> "1分未満"
                  else -> "-"
              }
          }

          private fun sumByUid(nsm: NetworkStatsManager, type: Int, start: Long, end: Long): Map<Int, Long> {
              val map = HashMap<Int, Long>()
              val stats = nsm.querySummary(type, null, start, end)
              val bucket = NetworkStats.Bucket()
              while (stats.hasNextBucket()) {
                  stats.getNextBucket(bucket)
                  map[bucket.uid] = (map[bucket.uid] ?: 0L) + bucket.rxBytes + bucket.txBytes
              }
              stats.close()
              return map
          }

          private fun deviceTotal(nsm: NetworkStatsManager, type: Int, s: Long, e: Long): Long =
              runCatching {
                  val b = nsm.querySummaryForDevice(type, null, s, e)
                  b.rxBytes + b.txBytes
              }.getOrDefault(0L)

          private val iconCache = HashMap<String, ImageBitmap?>()

          private fun iconOf(ctx: Context, pkg: String): ImageBitmap? = synchronized(iconCache) {
              iconCache.getOrPut(pkg) {
                  runCatching {
                      ctx.packageManager.getApplicationIcon(pkg).toBitmap(96, 96).asImageBitmap()
                  }.getOrNull()
              }
          }

          /** mode: 0=日, 1=週(月曜始まり), 2=月 / offset: 0=今, -1=ひとつ前 ... */
          fun rangeOf(mode: Int, offset: Int): Pair<Long, Long> {
              val c = Calendar.getInstance().apply {
                  firstDayOfWeek = Calendar.MONDAY
                  set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0)
                  set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
              }
              when (mode) {
                  0 -> c.add(Calendar.DAY_OF_YEAR, offset)
                  1 -> { c.set(Calendar.DAY_OF_WEEK, Calendar.MONDAY); c.add(Calendar.WEEK_OF_YEAR, offset) }
                  else -> { c.set(Calendar.DAY_OF_MONTH, 1); c.add(Calendar.MONTH, offset) }
              }
              val s = c.timeInMillis
              when (mode) {
                  0 -> c.add(Calendar.DAY_OF_YEAR, 1)
                  1 -> c.add(Calendar.WEEK_OF_YEAR, 1)
                  else -> c.add(Calendar.MONTH, 1)
              }
              return s to minOf(c.timeInMillis, System.currentTimeMillis())
          }

          fun periodLabel(mode: Int, offset: Int): String {
              val c = Calendar.getInstance().apply { timeInMillis = rangeOf(mode, offset).first }
              return when (mode) {
                  0 -> SimpleDateFormat("M月d日(E)", Locale.JAPAN).format(c.time)
                  1 -> {
                      val f = SimpleDateFormat("M/d", Locale.JAPAN)
                      val st = f.format(c.time)
                      c.add(Calendar.DAY_OF_YEAR, 6)
                      "$st 〜 ${f.format(c.time)}"
                  }
                  else -> SimpleDateFormat("yyyy年M月", Locale.JAPAN).format(c.time)
              }
          }

          fun loadAll(ctx: Context, mode: Int, offset: Int): Loaded {
              val (start, end) = rangeOf(mode, offset)
              val nsm = ctx.getSystemService(Context.NETWORK_STATS_SERVICE) as NetworkStatsManager
              