name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: アプリ名
        default: データ通信量
      package_name:
        description: パッケージ名（英小文字・数字・ドット）
        default: com.example.datausage
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/example/datausage
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DataUsage"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.datausage"
              compileSdk = 34
              defaultConfig {
                  applicationId = "${{ inputs.package_name || 'com.example.datausage' }}"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.2"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">${{ inputs.app_name || 'データ通信量' }}</string>
              <string name="name2">通信モニター</string>
              <string name="name3">Data Ring</string>
              <string name="name4">Bolt</string>
          </resources>
          EOF
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="bg1">#5B6CFF</color>
              <color name="bg2">#0EA5A4</color>
              <color name="bg3">#7C3AED</color>
              <color name="bg4">#F59E0B</color>
          </resources>
          EOF
          fg() { echo "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"108dp\" android:height=\"108dp\" android:viewportWidth=\"108\" android:viewportHeight=\"108\"><path android:fillColor=\"#FFFFFF\" $3 android:pathData=\"$2\"/></vector>" > app/src/main/res/drawable/fg$1.xml; }
          fg 1 "M32,72L42,72L42,58L32,58Z M49,72L59,72L59,46L49,46Z M66,72L76,72L76,34L66,34Z"
          fg 2 "M38,32L46,32L46,58L54,58L42,72L30,58L38,58Z M62,76L70,76L70,50L78,50L66,36L54,50L62,50Z"
          fg 3 "M54,54m-22,0a22,22 0 1,0 44,0a22,22 0 1,0 -44,0M54,54m-14,0a14,14 0 1,0 28,0a14,14 0 1,0 -28,0" 'android:fillType="evenOdd"'
          fg 4 "M58,30L40,58L52,58L48,78L68,48L55,48Z"
          for i in 1 2 3 4; do
            printf '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/bg%s"/><foreground android:drawable="@drawable/fg%s"/></adaptive-icon>\n' $i $i > app/src/main/res/mipmap-anydpi-v26/ic_$i.xml
          done
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <application
                  android:icon="@mipmap/ic_1"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:icon="@mipmap/ic_1" android:label="@string/app_name" />

                  <activity-alias android:name=".Alias1" android:targetActivity=".MainActivity"
                      android:exported="true" android:enabled="true"
                      android:icon="@mipmap/ic_1" android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>
                  <activity-alias android:name=".Alias2" android:targetActivity=".MainActivity"
                      android:exported="true" android:enabled="false"
                      android:icon="@mipmap/ic_2" android:label="@string/name2">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>
                  <activity-alias android:name=".Alias3" android:targetActivity=".MainActivity"
                      android:exported="true" android:enabled="false"
                      android:icon="@mipmap/ic_3" android:label="@string/name3">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>
                  <activity-alias android:name=".Alias4" android:targetActivity=".MainActivity"
                      android:exported="true" android:enabled="false"
                      android:icon="@mipmap/ic_4" android:label="@string/name4">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/datausage/MainActivity.kt <<'EOF'
          package com.example.datausage

          import android.app.Activity
          import android.app.AppOpsManager
          import android.app.usage.NetworkStats
          import android.app.usage.NetworkStatsManager
          import android.app.usage.UsageStatsManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.content.pm.ShortcutInfo
          import android.content.pm.ShortcutManager
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.net.ConnectivityManager
          import android.net.TrafficStats
          import android.os.BatteryManager
          import android.os.Bundle
          import android.os.Process
          import android.provider.Settings
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.graphics.toArgb
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.SpanStyle
          import androidx.compose.ui.text.buildAnnotatedString
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.text.withStyle
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.graphics.drawable.toBitmap
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          const val NS = "com.example.datausage"
          private val PRESET_LABELS = listOf("📶 データ通信量(標準)", "⇅ 通信モニター", "◯ Data Ring", "⚡ Bolt")
          private val WifiColor = Color(0xFF4FC3F7)
          private val MobileColor = Color(0xFFFFB74D)

          private val DarkScheme = darkColorScheme(
              primary = Color(0xFF8FA8FF),
              background = Color(0xFF0E1117),
              surface = Color(0xFF171B24),
              onBackground = Color(0xFFE8EAF0),
              onSurface = Color(0xFFE8EAF0),
              onSurfaceVariant = Color(0xFF9AA3B5),
              surfaceVariant = Color(0xFF262C38)
          )
          private val LightScheme = lightColorScheme(
              primary = Color(0xFF4A63E7),
              background = Color(0xFFF3F5FB),
              surface = Color.White,
              onBackground = Color(0xFF14171F),
              onSurface = Color(0xFF14171F),
              onSurfaceVariant = Color(0xFF6B7385),
              surfaceVariant = Color(0xFFE4E8F2)
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  applyRefreshRate(this, getSharedPreferences("s", 0).getBoolean("hz", true))
                  setContent {
                      MaterialTheme(colorScheme = if (isSystemInDarkTheme()) DarkScheme else LightScheme) {
                          Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) { Root() }
                      }
                  }
              }
          }

          // ---------- 120Hz ----------
          @Suppress("DEPRECATION")
          fun applyRefreshRate(act: Activity, enabled: Boolean) {
              val d = act.windowManager.defaultDisplay
              val cur = d.mode
              val best = d.supportedModes
                  .filter { it.physicalWidth == cur.physicalWidth && it.physicalHeight == cur.physicalHeight }
                  .maxByOrNull { it.refreshRate } ?: return
              val lp = act.window.attributes
              lp.preferredDisplayModeId = if (enabled) best.modeId else 0
              lp.preferredRefreshRate = if (enabled) best.refreshRate else 0f
              act.window.attributes = lp
          }

          // ---------- アイコン/名前 ----------
          fun setLauncherPreset(ctx: Context, sel: Int) {
              val pm = ctx.packageManager
              fun cn(i: Int) = ComponentName(ctx.packageName, "$NS.Alias${i + 1}")
              pm.setComponentEnabledSetting(cn(sel), PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP)
              PRESET_LABELS.indices.filter { it != sel }.forEach {
                  pm.setComponentEnabledSetting(cn(it), PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP)
              }
          }

          fun pinShortcut(ctx: Context, name: String, emoji: String, bg: Int): Boolean {
              val sm = ctx.getSystemService(ShortcutManager::class.java)
              if (!sm.isRequestPinShortcutSupported) return false
              val bmp = Bitmap.createBitmap(192, 192, Bitmap.Config.ARGB_8888)
              val c = Canvas(bmp)
              val p = Paint(Paint.ANTI_ALIAS_FLAG)
              p.color = bg
              c.drawRoundRect(0f, 0f, 192f, 192f, 48f, 48f, p)
              p.color = 0xFFFFFFFF.toInt()
              p.textSize = 104f
              p.textAlign = Paint.Align.CENTER
              val y = 96f - (p.descent() + p.ascent()) / 2
              c.drawText(emoji.ifBlank { "📶" }, 96f, y, p)
              val intent = Intent(ctx, MainActivity::class.java).setAction(Intent.ACTION_MAIN)
              val info = ShortcutInfo.Builder(ctx, "c${System.currentTimeMillis()}")
                  .setShortLabel(name.ifBlank { "通信量" })
                  .setIcon(android.graphics.drawable.Icon.createWithBitmap(bmp))
                  .setIntent(intent)
                  .build()
              return sm.requestPinShortcut(info, null)
          }

          // ---------- データ ----------
          data class AppUsage(
              val label: String, val pkg: String,
              val wifi: Long, val mobile: Long, val fgMs: Long,
              val icon: ImageBitmap?
          ) {
              val total get() = wifi + mobile
          }

          data class DayTotal(val label: String, val wifi: Long, val mobile: Long)
          data class Loaded(val apps: List<AppUsage> = emptyList(), val days: List<DayTotal> = emptyList())
          data class Batt(val pct: Int, val charging: Boolean, val tempC: Float)

          fun readBattery(ctx: Context): Batt {
              val i = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
              val lv = i?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
              val sc = i?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
              val st = i?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
              val t = i?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0
              return Batt(
                  if (lv < 0) 0 else lv * 100 / sc,
                  st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL,
                  t / 10f
              )
          }

          fun hasUsageAccess(ctx: Context): Boolean {
              val ops = ctx.getSystemService(AppOpsManager::class.java)
              return ops.unsafeCheckOpNoThrow(
                  AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), ctx.packageName
              ) == AppOpsManager.MODE_ALLOWED
          }

          fun fmt(b: Long): String = when {
              b >= 1L shl 30 -> "%.2f GB".format(b / (1L shl 30).toDouble())
              b >= 1L shl 20 -> "%.1f MB".format(b / (1L shl 20).toDouble())
              b >= 1L shl 10 -> "%.0f KB".format(b / 1024.0)
              else -> "$b B"
          }

          fun fmtTime(ms: Long): String {
              val m = ms / 60000
              return when {
                  m >= 60 -> "${m / 60}時間${m % 60}分"
                  m >= 1 -> "${m}分"
                  ms > 0 -> "1分未満"
                  else -> "-"
              }
          }

          private fun sumByUid(nsm: NetworkStatsManager, type: Int, start: Long, end: Long): Map<Int, Long> {
              val map = HashMap<Int, Long>()
              val stats = nsm.querySummary(type, null, start, end)
              val bucket = NetworkStats.Bucket()
              while (stats.hasNextBucket()) {
                  stats.getNextBucket(bucket)
                  map[bucket.uid] = (map[bucket.uid] ?: 0L) + bucket.rxBytes + bucket.txBytes
              }
              stats.close()
              return map
          }

          private fun deviceTotal(nsm: NetworkStatsManager, type: Int, s: Long, e: Long): Long =
              runCatching {
                  val b = nsm.querySummaryForDevice(type, null, s, e)
                  b.rxBytes + b.txBytes
              }.getOrDefault(0L)

          private val iconCache = HashMap<String, ImageBitmap?>()

          private fun iconOf(ctx: Context, pkg: String): ImageBitmap? = synchronized(iconCache) {
              iconCache.getOrPut(pkg) {
                  runCatching {
                      ctx.packageManager.getApplicationIcon(pkg).toBitmap(96, 96).asImageBitmap()
                  }.getOrNull()
              }
          }

          /** mode: 0=日, 1=週(月曜始まり), 2=月 / offset: 0=今, -1=ひとつ前 ... */
          fun rangeOf(mode: Int, offset: Int): Pair<Long, Long> {
              val c = Calendar.getInstance().apply {
                  firstDayOfWeek = Calendar.MONDAY
                  set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0)
                  set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
              }
              when (mode) {
                  0 -> c.add(Calendar.DAY_OF_YEAR, offset)
                  1 -> { c.set(Calendar.DAY_OF_WEEK, Calendar.MONDAY); c.add(Calendar.WEEK_OF_YEAR, offset) }
                  else -> { c.set(Calendar.DAY_OF_MONTH, 1); c.add(Calendar.MONTH, offset) }
              }
              val s = c.timeInMillis
              when (mode) {
                  0 -> c.add(Calendar.DAY_OF_YEAR, 1)
                  1 -> c.add(Calendar.WEEK_OF_YEAR, 1)
                  else -> c.add(Calendar.MONTH, 1)
              }
              return s to minOf(c.timeInMillis, System.currentTimeMillis())
          }

          fun periodLabel(mode: Int, offset: Int): String {
              val c = Calendar.getInstance().apply { timeInMillis = rangeOf(mode, offset).first }
              return when (mode) {
                  0 -> SimpleDateFormat("M月d日(E)", Locale.JAPAN).format(c.time)
                  1 -> {
                      val f = SimpleDateFormat("M/d", Locale.JAPAN)
                      val st = f.format(c.time)
                      c.add(Calendar.DAY_OF_YEAR, 6)
                      "$st 〜 ${f.format(c.time)}"
                  }
                  else -> SimpleDateFormat("yyyy年M月", Locale.JAPAN).format(c.time)
              }
          }

          fun loadAll(ctx: Context, mode: Int, offset: Int): Loaded {
              val (start, end) = rangeOf(mode, offset)
              val nsm = ctx.getSystemService(Context.NETWORK_STATS_SERVICE) as NetworkStatsManager
              val wifi = sumByUid(nsm, ConnectivityManager.TYPE_WIFI, start, end)
              val mobile = sumByUid(nsm, ConnectivityManager.TYPE_MOBILE, start, end)
              val pm = ctx.packageManager

              // [0]=wifi, [1]=mobile, [2]=画面使用時間(ms)
              val byPkg = HashMap<String, LongArray>()
              fun keyOf(uid: Int) = pm.getPackagesForUid(uid)?.firstOrNull() ?: "uid:$uid"
              wifi.forEach { (uid, v) -> byPkg.getOrPut(keyOf(uid)) { LongArray(3) }[0] += v }
              mobile.forEach { (uid, v) -> byPkg.getOrPut(keyOf(uid)) { LongArray(3) }[1] += v }

              val usm = ctx.getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
              usm.queryAndAggregateUsageStats(start, end).forEach { (p, s) ->
                  if (s.totalTimeInForeground > 0) byPkg.getOrPut(p) { LongArray(3) }[2] = s.totalTimeInForeground
              }

              val apps = byPkg.mapNotNull { (pkg, a) ->
                  if (a.all { it == 0L }) return@mapNotNull null
                  val label = runCatching {
                      pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString()
                  }.getOrNull() ?: if (pkg.startsWith("uid:")) "システム/その他 ($pkg)" else pkg
                  AppUsage(label, pkg, a[0], a[1], a[2], iconOf(ctx, pkg))
              }

              val days = if (mode == 0) emptyList() else {
                  val out = ArrayList<DayTotal>()
                  val c = Calendar.getInstance().apply { timeInMillis = start }
                  val wf = SimpleDateFormat("E", Locale.JAPAN)
                  while (c.timeInMillis < end) {
                      val s = c.timeInMillis
                      val label = if (mode == 1) wf.format(Date(s)) else c.get(Calendar.DAY_OF_MONTH).toString()
                      c.add(Calendar.DAY_OF_YEAR, 1)
                      val e = minOf(c.timeInMillis, end)
                      out += DayTotal(
                          label,
                          deviceTotal(nsm, ConnectivityManager.TYPE_WIFI, s, e),
                          deviceTotal(nsm, ConnectivityManager.TYPE_MOBILE, s, e)
                      )
                  }
                  out
              }
              return Loaded(apps, days)
          }

          // ---------- UI ----------
          @Composable
          fun Root() {
              val ctx = LocalContext.current
              var granted by remember { mutableStateOf(hasUsageAccess(ctx)) }
              LaunchedEffect(granted) {
                  while (!granted) { delay(1000); granted = hasUsageAccess(ctx) }
              }
              if (granted) UsageScreen() else {
                  Column(
                      Modifier.fillMaxSize().padding(32.dp),
                      verticalArrangement = Arrangement.Center,
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Text("📶", fontSize = 56.sp)
                      Spacer(Modifier.height(16.dp))
                      Text("使用状況へのアクセスを許可してください", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(8.dp))
                      Text(
                          "通信量と画面使用時間の取得に必要です。設定でこのアプリをオンにしてください。",
                          color = MaterialTheme.colorScheme.onSurfaceVariant
                      )
                      Spacer(Modifier.height(24.dp))
                      Button(onClick = {
                          ctx.startActivity(
                              Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          )
                      }) { Text("設定を開く") }
                  }
              }
          }

          @Composable
          fun UsageScreen() {
              val ctx = LocalContext.current
              var mode by remember { mutableIntStateOf(0) }
              var offset by remember { mutableIntStateOf(0) }
              var sortBy by remember { mutableIntStateOf(0) }
              var showSettings by remember { mutableStateOf(false) }
              var data by remember { mutableStateOf(Loaded()) }
              var speed by remember { mutableStateOf(0L to 0L) }
              var batt by remember { mutableStateOf(readBattery(ctx)) }

              BackHandler(enabled = showSettings) { showSettings = false }

              LaunchedEffect(mode, offset) {
                  while (true) {
                      withContext(Dispatchers.IO) { runCatching { loadAll(ctx, mode, offset) }.getOrNull() }
                          ?.let { data = it }
                      batt = readBattery(ctx)
                      if (offset < 0) break
                      delay(3000)
                  }
              }
              LaunchedEffect(Unit) {
                  var rx = TrafficStats.getTotalRxBytes()
                  var tx = TrafficStats.getTotalTxBytes()
                  while (true) {
                      delay(1000)
                      val r = TrafficStats.getTotalRxBytes()
                      val t = TrafficStats.getTotalTxBytes()
                      speed = (r - rx) to (t - tx)
                      rx = r; tx = t
                  }
              }

              if (showSettings) { SettingsScreen { showSettings = false }; return }

              val sorted = if (sortBy == 0) data.apps.sortedByDescending { it.total }
              else data.apps.sortedByDescending { it.fgMs }
              val max = (data.apps.maxOfOrNull { it.total } ?: 1L).coerceAtLeast(1L).toFloat()

              LazyColumn(
                  Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  item { Header(speed, data.apps, batt) { showSettings = true } }
                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf("日", "週", "月").forEachIndexed { i, s ->
                              FilterChip(
                                  selected = mode == i,
                                  onClick = { mode = i; offset = 0 },
                                  label = { Text(s) }, shape = RoundedCornerShape(50)
                              )
                          }
                      }
                  }
                  item {
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                          TextButton(onClick = { offset-- }) { Text("◀") }
                          Text(
                              periodLabel(mode, offset), Modifier.weight(1f),
                              textAlign = TextAlign.Center, fontWeight = FontWeight.SemiBold, fontSize = 16.sp
                          )
                          TextButton(onClick = { offset++ }, enabled = offset < 0) { Text("▶") }
                      }
                  }
                  if (mode > 0 && data.days.isNotEmpty()) item { DayChart(data.days, mode) }
                  item {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          Text("アプリ別", fontWeight = FontWeight.SemiBold, fontSize = 15.sp)
                          FilterChip(
                              selected = sortBy == 1,
                              onClick = { sortBy = if (sortBy == 0) 1 else 0 },
                              label = { Text(if (sortBy == 0) "通信量順" else "使用時間順") },
                              shape = RoundedCornerShape(50)
                          )
                      }
                  }
                  if (sorted.isEmpty()) item {
                      Text(
                          "この期間のデータがありません（OSが保持している期間より前の可能性があります）",
                          color = MaterialTheme.colorScheme.onSurfaceVariant, fontSize = 13.sp
                      )
                  }
                  items(sorted, key = { it.pkg }) { a -> AppRow(a, max) }
              }
          }

          @Composable
          fun Stat(label: String, value: String) {
              Column {
                  Text(label, color = Color.White.copy(alpha = 0.7f), fontSize = 11.sp)
                  Text(value, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
              }
          }

          @Composable
          fun Header(speed: Pair<Long, Long>, list: List<AppUsage>, batt: Batt, onSettings: () -> Unit) {
              Box(
                  Modifier.fillMaxWidth()
                      .clip(RoundedCornerShape(28.dp))
                      .background(Brush.linearGradient(listOf(Color(0xFF5B6CFF), Color(0xFF9B5CFF))))
                      .padding(20.dp)
              ) {
                  Text(
                      "⚙", fontSize = 22.sp, color = Color.White,
                      modifier = Modifier.align(Alignment.TopEnd).clickable { onSettings() }.padding(4.dp)
                  )
                  Column {
                      Text("リアルタイム速度", color = Color.White.copy(alpha = 0.75f), fontSize = 12.sp)
                      Text("↓ ${fmt(speed.first)}/s", color = Color.White, fontSize = 28.sp, fontWeight = FontWeight.Bold)
                      Text("↑ ${fmt(speed.second)}/s", color = Color.White.copy(alpha = 0.9f), fontSize = 16.sp)
                      Spacer(Modifier.height(18.dp))
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          Stat("合計", fmt(list.sumOf { it.total }))
                          Stat("Wi-Fi", fmt(list.sumOf { it.wifi }))
                          Stat("モバイル", fmt(list.sumOf { it.mobile }))
                      }
                      Spacer(Modifier.height(16.dp))
                      Text(
                          "🔋 ${batt.pct}%" + (if (batt.charging) " ⚡充電中" else "") + "  ・  🌡 ${"%.1f".format(batt.tempC)}°C",
                          color = Color.White.copy(alpha = 0.9f), fontSize = 13.sp
                      )
                  }
              }
          }

          @Composable
          fun DayChart(days: List<DayTotal>, mode: Int) {
              val cs = MaterialTheme.colorScheme
              val max = (days.maxOfOrNull { it.wifi + it.mobile } ?: 1L).coerceAtLeast(1L).toFloat()
              Surface(shape = RoundedCornerShape(20.dp), color = cs.surface, tonalElevation = 1.dp) {
                  Column(Modifier.padding(14.dp)) {
                      Text("日ごとの通信量（最大 ${fmt(max.toLong())}）", fontSize = 12.sp, color = cs.onSurfaceVariant)
                      Spacer(Modifier.height(8.dp))
                      Row(
                          Modifier.fillMaxWidth().height(90.dp),
                          horizontalArrangement = Arrangement.spacedBy(2.dp),
                          verticalAlignment = Alignment.Bottom
                      ) {
                          days.forEach { d ->
                              val t = d.wifi + d.mobile
                              val h = maxOf(2f, 90f * t / max).dp
                              Box(Modifier.weight(1f).height(h).clip(RoundedCornerShape(3.dp)).background(cs.surfaceVariant)) {
                                  if (t > 0) Column(Modifier.fillMaxSize()) {
                                      if (d.mobile > 0) Box(Modifier.weight(d.mobile.toFloat()).fillMaxWidth().background(MobileColor))
                                      if (d.wifi > 0) Box(Modifier.weight(d.wifi.toFloat()).fillMaxWidth().background(WifiColor))
                                  }
                              }
                          }
                      }
                      Spacer(Modifier.height(4.dp))
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(2.dp)) {
                          days.forEachIndexed { i, d ->
                              Text(
                                  if (mode == 1 || i % 5 == 0) d.label else "",
                                  Modifier.weight(1f), textAlign = TextAlign.Center,
                                  fontSize = 9.sp, color = cs.onSurfaceVariant, maxLines = 1
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun AppRow(a: AppUsage, max: Float) {
              val cs = MaterialTheme.colorScheme
              Surface(shape = RoundedCornerShape(20.dp), color = cs.surface, tonalElevation = 1.dp) {
                  Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                      if (a.icon != null) {
                          Image(a.icon, null, Modifier.size(46.dp).clip(RoundedCornerShape(12.dp)))
                      } else {
                          Box(Modifier.size(46.dp).clip(RoundedCornerShape(12.dp)).background(cs.surfaceVariant))
                      }
                      Spacer(Modifier.width(12.dp))
                      Column(Modifier.weight(1f)) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text(
                                  a.label, Modifier.weight(1f), maxLines = 1, overflow = TextOverflow.Ellipsis,
                                  fontWeight = FontWeight.SemiBold, fontSize = 15.sp, color = cs.onSurface
                              )
                              Spacer(Modifier.width(8.dp))
                              Text(fmt(a.total), fontWeight = FontWeight.Bold, fontSize = 15.sp, color = cs.primary)
                          }
                          Text(a.pkg, maxLines = 1, overflow = TextOverflow.Ellipsis, fontSize = 11.sp, color = cs.onSurfaceVariant)
                          Spacer(Modifier.height(8.dp))
                          Box(Modifier.fillMaxWidth().height(6.dp).clip(RoundedCornerShape(3.dp)).background(cs.surfaceVariant)) {
                              val f = (a.total / max).coerceIn(0f, 1f)
                              if (a.total > 0) {
                                  Row(Modifier.fillMaxWidth(f).fillMaxHeight()) {
                                      if (a.wifi > 0) Box(Modifier.weight(a.wifi.toFloat()).fillMaxHeight().background(WifiColor))
                                      if (a.mobile > 0) Box(Modifier.weight(a.mobile.toFloat()).fillMaxHeight().background(MobileColor))
                                  }
                              }
                          }
                          Spacer(Modifier.height(6.dp))
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                              Text(
                                  buildAnnotatedString {
                                      withStyle(SpanStyle(color = WifiColor)) { append("● ") }
                                      append("${fmt(a.wifi)}   ")
                                      withStyle(SpanStyle(color = MobileColor)) { append("● ") }
                                      append(fmt(a.mobile))
                                  },
                                  fontSize = 11.sp, color = cs.onSurfaceVariant
                              )
                              Text("🕒 ${fmtTime(a.fgMs)}", fontSize = 11.sp, color = cs.onSurfaceVariant)
                          }
                      }
                  }
              }
          }

          // ---------- 設定画面 ----------
          @Composable
          fun Section(title: String, content: @Composable ColumnScope.() -> Unit) {
              val cs = MaterialTheme.colorScheme
              Surface(shape = RoundedCornerShape(20.dp), color = cs.surface, tonalElevation = 1.dp) {
                  Column(Modifier.fillMaxWidth().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      Text(title, fontWeight = FontWeight.Bold, fontSize = 15.sp, color = cs.onSurface)
                      content()
                  }
              }
          }

          @Composable
          fun SettingsScreen(onBack: () -> Unit) {
              val ctx = LocalContext.current
              val cs = MaterialTheme.colorScheme
              val prefs = remember { ctx.getSharedPreferences("s", 0) }
              var hz by remember { mutableStateOf(prefs.getBoolean("hz", true)) }
              var preset by remember { mutableIntStateOf(prefs.getInt("preset", 0)) }
              var name by remember { mutableStateOf("") }
              var emoji by remember { mutableStateOf("📶") }
              var colorIdx by remember { mutableIntStateOf(0) }
              val colors = listOf(0xFF5B6CFFL, 0xFFE5484DL, 0xFF30A46CL, 0xFFF5A524L, 0xFF111111L)
              BackHandler { onBack() }

              LazyColumn(
                  Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(16.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  item {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          TextButton(onClick = onBack) { Text("◀ 戻る") }
                          Spacer(Modifier.width(8.dp))
                          Text("設定", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = cs.onBackground)
                      }
                  }
                  item {
                      Section("表示") {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Column(Modifier.weight(1f)) {
                                  Text("高リフレッシュレート（最大120Hz）", color = cs.onSurface)
                                  Text(
                                      "対応端末でスクロールが滑らかになります。バッテリー消費は少し増えます。",
                                      fontSize = 12.sp, color = cs.onSurfaceVariant
                                  )
                              }
                              Switch(checked = hz, onCheckedChange = {
                                  hz = it
                                  prefs.edit().putBoolean("hz", it).apply()
                                  (ctx as? Activity)?.let { a -> applyRefreshRate(a, it) }
                              })
                          }
                      }
                  }
                  item {
                      Section("ホーム画面のアイコンと名前（プリセット）") {
                          PRESET_LABELS.forEachIndexed { i, label ->
                              val select = {
                                  preset = i
                                  prefs.edit().putInt("preset", i).apply()
                                  setLauncherPreset(ctx, i)
                                  Toast.makeText(ctx, "反映まで数秒〜数十秒かかります", Toast.LENGTH_SHORT).show()
                              }
                              Row(Modifier.fillMaxWidth().clickable { select() }, verticalAlignment = Alignment.CenterVertically) {
                                  RadioButton(selected = preset == i, onClick = { select() })
                                  Text(label, color = cs.onSurface)
                              }
                          }
                      }
                  }
                  item {
                      Section("好きな名前・アイコンでホーム画面に追加") {
                          OutlinedTextField(
                              value = name, onValueChange = { name = it },
                              label = { Text("アプリ名") }, singleLine = true, modifier = Modifier.fillMaxWidth()
                          )
                          OutlinedTextField(
                              value = emoji, onValueChange = { emoji = it.take(4) },
                              label = { Text("アイコンの絵文字") }, singleLine = true, modifier = Modifier.fillMaxWidth()
                          )
                          Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                              colors.forEachIndexed { i, c ->
                                  Box(
                                      Modifier.size(36.dp).clip(CircleShape).background(Color(c))
                                          .then(if (colorIdx == i) Modifier.border(3.dp, cs.onSurface, CircleShape) else Modifier)
                                          .clickable { colorIdx = i }
                                  )
                              }
                          }
                          Button(onClick = {
                              val ok = pinShortcut(ctx, name, emoji, Color(colors[colorIdx]).toArgb())
                              Toast.makeText(ctx, if (ok) "追加の確認画面で許可してください" else "このホーム画面は非対応です", Toast.LENGTH_SHORT).show()
                          }) { Text("ホーム画面に追加") }
                      }
                  }
                  item {
                      Section("パッケージ名") {
                          Text(
                              "アプリ内からは変更できません。GitHub の Actions → Build APK → Run workflow で、アプリ名とパッケージ名を入力してビルドし直してください（別のアプリとしてインストールされます）。",
                              fontSize = 13.sp, color = cs.onSurfaceVariant
                          )
                      }
                  }
              }
          }
          EOF
      - run: gradle assembleDebug --no-daemon
      - name: APKの場所を確認
        run: find app/build/outputs -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DataUsage-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Releaseに公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --title "Build ${{ github.run_number }}" --notes "APK"